</style><header><strong>✧ 测验工坊</strong><span>QUIZ LAUNCH KIT / 01</span></header><main><div class="hero"><div class="eyebrow">一个想法 → 一份题库 → 一个网站</div><h1>把你的灵感，<br>做成别人愿意探索的测试。</h1><p>改标题、换题库、选配色，导出一个能独立打开的网站。先做好体验，再验证付费需求。</p><a href="docs/START-HERE.md">新手操作指南</a> · <a href="docs/SOP.md">从选题到交付的 SOP</a></div><div class="grid"><section class="panel"><h2>01 / 制作你的版本</h2><label for="title">测试标题</label><input id="title"><label for="subtitle">一句邀请</label><input id="subtitle"><label for="theme">视觉氛围</label><select id="theme"><option value="green">湖岸 · 苔绿与奶油白</option><option value="rose">旧信 · 玫瑰与纸白</option><option value="blue">夜航 · 靛蓝与雾白</option></select><label for="file">导入 AI 生成或自己改好的 JSON 题库</label><input id="file" type="file" accept=".json,application/json"><details><summary>编辑完整题库 / 权重 / 结果</summary><label for="json">JSON 配置</label><textarea id="json" spellcheck="false"></textarea><button id="apply">校验并应用 JSON</button></details><button id="preview">更新试玩</button><button id="download">导出独立网站</button><button id="save">保存题库 JSON</button><p id="status" role="status"></p><p class="subtle">导出的是免费体验版，没有支付或防分享功能。付费交付请使用仓库中的服务器兑换码方案。生成器不上传题库。</p></section><section><h2>02 / 实时试玩</h2><div id="quiz"></div></section></div></main><footer>免费开源 · 不承诺收益 · 不把趣味测试包装为科学测评</footer><script src="engine.js"></script><script src="runtime.js"></script><script src="builder.js"></script></html>
